<input [(ngModel)]="username" placeholder="Введите имя" />
<input
  [value]="username"
  (input)="onInputChange($event)"
  placeholder="Введите имя: (кастомный обработчик)"
>
<h2>{{ greet() }}</h2>
<p>{{message}}</p>
<p>Счетчик: {{counter}}</p>
<button
  (click)="incrementCounter()"
>Увеличить</button>
